<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Projects — Nargish | Web Developer Portfolio</title>
<meta name="description" content="Explore Nargish's web developer portfolio projects — responsive websites and web apps, technology and results.">
<meta name="robots" content="index, follow">
<meta http-equiv="Cache-Control" content="no-store">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f3f7fd; --text:#131a2c; --text-dim:#5b6478; --violet:#7c5cff; --violet-2:#6d3fe0; --cyan:#0891b2;
    --line:rgba(19,26,44,0.1); --card:#ffffff;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg); color:var(--text); font-family:'Manrope',sans-serif; font-size:16px; line-height:1.6; -webkit-font-smoothing:antialiased;}
  a{color:inherit;}
  header{position:sticky; top:0; z-index:30; background:rgba(243,247,253,0.85); backdrop-filter:blur(14px); border-bottom:1px solid var(--line);}
  .nav{max-width:1120px; margin:0 auto; padding:18px 24px; display:flex; align-items:center; justify-content:space-between; gap:16px;}
  .logo{font-family:'Unbounded'; font-weight:700; font-size:1.1rem; text-decoration:none;}
  .logo span{color:var(--cyan);}
  .nav-links{display:flex; gap:22px;}
  .nav-links a{text-decoration:none; font-weight:600; font-size:.92rem; color:var(--text-dim); transition:color .25s ease;}
  .nav-links a:hover{color:var(--violet-2);}
  .nav-links a.active{color:var(--text);}
  main{max-width:1120px; margin:0 auto; padding:44px 24px 90px;}
  h1{font-family:'Unbounded'; font-weight:600; font-size:clamp(1.6rem,3.4vw,2.2rem); letter-spacing:-.01em; margin-bottom:10px;}
  .lead{color:var(--text-dim); max-width:640px; margin-bottom:34px;}
  .loading-box{display:flex; align-items:center; gap:12px; color:var(--text-dim); padding:50px 0;}
  .spinner{width:22px;height:22px;border:3px solid rgba(124,92,255,0.25); border-top-color:var(--violet-2); border-radius:50%; animation:spin .7s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:22px;}
  .card{background:var(--card); border:1px solid var(--line); border-radius:18px; overflow:hidden; text-decoration:none; display:block; transition:transform .3s ease, box-shadow .3s ease;}
  .card:hover{transform:translateY(-4px); box-shadow:0 22px 44px -24px rgba(19,26,44,0.45);}
  .thumb{aspect-ratio:16/9; background:linear-gradient(135deg,#e5e7eb,#d1d5db); display:flex; align-items:center; justify-content:center; overflow:hidden;}
  .thumb img{width:100%;height:100%;object-fit:cover;}
  .thumb .ph{color:#9ca3af; font-weight:800; letter-spacing:.08em; text-transform:uppercase; font-size:.8rem;}
  .card-body{padding:20px 22px 22px;}
  .card-title{font-family:'Unbounded'; font-weight:600; font-size:1.02rem; margin-bottom:8px;}
  .card-desc{color:var(--text-dim); font-size:.92rem; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; margin-bottom:12px;}
  .tech{display:flex; flex-wrap:wrap; gap:6px;}
  .tech span{font-size:.73rem; font-weight:600; background:rgba(8,145,178,0.1); color:#0e7490; padding:3px 9px; border-radius:999px;}
  .error-box{padding:44px 20px; text-align:center; color:var(--text-dim); background:var(--card); border:1px dashed var(--line); border-radius:16px; font-size:.95rem; line-height:1.7;}
  .error-box a{color:var(--violet-2); font-weight:700;}
  /* detail */
  .detail{max-width:820px; margin:0 auto;}
  .backlink{display:inline-flex; align-items:center; gap:8px; color:var(--text-dim); text-decoration:none; font-weight:600; font-size:.9rem; margin-bottom:26px; transition:color .25s ease;}
  .backlink:hover{color:var(--violet-2);}
  .detail-hero{display:grid; grid-template-columns:1.4fr 1fr; gap:26px; align-items:start; margin-bottom:30px;}
  .detail-title{font-family:'Unbounded'; font-weight:600; font-size:clamp(1.5rem,3.2vw,2.1rem); letter-spacing:-.01em; margin-bottom:14px;}
  .detail-desc{color:var(--text-dim); font-size:1.02rem;}
  .detail-side{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:20px;}
  .detail-side h2{font-family:'Unbounded'; font-size:.85rem; text-transform:uppercase; letter-spacing:.08em; color:var(--text-dim); margin-bottom:14px;}
  .dl{list-style:none;}
  .dl li{padding:9px 0; border-bottom:1px solid var(--line); font-size:.92rem; word-break:break-word;}
  .dl li:last-child{border-bottom:0;}
  .dl strong{display:block; color:var(--text-dim); font-size:.78rem; text-transform:uppercase; letter-spacing:.05em; margin-bottom:2px;}
  .links{display:flex; gap:10px; flex-wrap:wrap; margin-top:6px;}
  .links a{display:inline-flex; padding:9px 16px; border-radius:999px; font-size:.82rem; font-weight:700; text-decoration:none;}
  .links .live{background:linear-gradient(100deg,var(--violet),var(--cyan)); color:#07070f;}
  .links .git{background:transparent; border:1px solid var(--line); color:var(--text-dim);}
  .detail-thumb{border-radius:16px; overflow:hidden; margin-top:6px; background:linear-gradient(135deg,#e5e7eb,#d1d5db);}
  .detail-thumb img{width:100%; display:block;}
  .feat-h{font-family:'Unbounded'; font-size:.85rem; text-transform:uppercase; letter-spacing:.08em; color:var(--text-dim); margin:24px 0 10px;}
  .feat-list{list-style:none; display:grid; gap:8px;}
  .feat-list li{position:relative; padding-left:24px; font-size:.95rem; line-height:1.55; color:var(--text-dim);}
  .feat-list li::before{content:'✓'; position:absolute; left:0; top:0; font-weight:800; color:var(--violet);}
  @media (max-width:700px){
    .detail-hero{grid-template-columns:1fr;}
    .nav{padding:15px 18px;}
    .nav-links{gap:14px;}
    main{padding:32px 18px 70px;}
  }
</style>
</head>
<body>
  <header>
    <nav class="nav">
      <a class="logo" href="/">Nargish<span>.</span></a>
      <div class="nav-links">
        <a href="/">Home</a>
        <a href="/projects" class="active">Projects</a>
        <a href="/blog">Blog</a>
      </div>
    </nav>
  </header>

  <main>
    <div class="loading-box" id="loadingBox"><span class="spinner"></span> <span>Projects load ho rahe hain…</span></div>
    <div id="content" style="display:none;"></div>
    <div class="error-box" id="errorBox" style="display:none;"></div>
  </main>

  <script src="/supabase-loader.js?v=2" defer></script>
  <script src="/supabase.config.js?v=3" defer></script>
  <script src="/projects/projects.js?v=5" defer></script>
</body>
</html>
